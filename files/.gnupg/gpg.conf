# Default key for signing (personal — amery@geeks.cl / amery@linux.com)
default-key 548E7E86E8F55842

# Digest preferences
personal-digest-preferences SHA512 SHA384 SHA256
cert-digest-algo SHA512
default-preference-list SHA512 SHA384 SHA256 AES256 AES192 AES ZLIB BZIP2 ZIP Uncompressed

# Display
keyid-format long
with-fingerprint

# Suppress version and comments in output
no-emit-version
no-comments

# Trust model
trust-model tofu+pgp

# Never autostart a local gpg-agent. On hosts that use a forwarded
# agent (see AGENTS.md, "GPG Agent Forwarding") this stops a stray gpg
# call from spawning a local agent that unlinks the tunnelled socket.
# The agent is started explicitly where wanted (.bashrc / systemd).
no-autostart
