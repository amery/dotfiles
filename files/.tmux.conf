# load TMUX_VERSION
run-shell "\
	echo #{version} | sed -e 's|\\.| |g' -e 's|[a-z]*$||' |\
	while read x y; do\
		tmux set-environment -g TMUX_VERSION \$((x * 100 + y));\
	done"

# https://github.com/tmux/tmux/blob/master/CHANGES
#
# version-gated below; TMUX_VERSION guards the floor at 2.4
#
# 3.3
# * allow-passthrough added
# 3.2
# * extended-keys added
# 2.9
# * individual -fg/-bg removed, use -style instead
# 2.4
# * vi-copy syntax changes
# 2.2
# * UTF8 autodetected, `set status-utf8` not accepted.
# 2.1
# * mouse-* options merged into single `mouse`
#

# same prefix as `screen`
set -g prefix C-a
unbind C-b

# 0-indexed is not keyboard friendly
set -g base-index 1
set -g pane-base-index 1

# misc features
set -s escape-time 1
setw -g mode-keys vi
set -g focus-events on    # pass terminal focus in/out to apps (vim, claude, ...)
set -as terminal-overrides ",xterm*:Tc"   # 24-bit truecolor (xterm* skips linux/vt consoles)

# version-gated (see CHANGES)
if-shell -b 'test $TMUX_VERSION -ge 302' 'set -s extended-keys on'      # CSI-u extended keys (Ctrl+I vs Tab, ...)
if-shell -b 'test $TMUX_VERSION -ge 303' 'set -g allow-passthrough on'  # DCS passthrough (image protocols, OSC)

# refresh VSCode / Remote-Containers env from the attaching client, so a
# re-attached session (and panes opened after) pick up live sockets.
# vscode-refresh-env handles the reload-in-place case where no re-attach
# fires. DISPLAY and SSH_AUTH_SOCK are already in the tmux default list.
set -ga update-environment " \
	BROWSER \
	GIT_ASKPASS \
	REMOTE_CONTAINERS_DISPLAY_SOCK \
	REMOTE_CONTAINERS_IPC \
	REMOTE_CONTAINERS_SOCKETS \
	VSCODE_GIT_ASKPASS_EXTRA_ARGS \
	VSCODE_GIT_ASKPASS_MAIN \
	VSCODE_GIT_ASKPASS_NODE \
	VSCODE_GIT_IPC_HANDLE \
	VSCODE_IPC_HOOK_CLI \
	"

# mouse -- tmux owns it: drag-select/copy, wheel-scroll, click-to-select-pane.
# Hold Shift for the terminal's own selection / context menu.
set -g mouse on
# ^A m -- toggle mouse (off = full-screen terminal-native drag-select)
bind m set -g mouse \; display "Mouse: #{?mouse,on,off}"

# reload config + environment -- re-source, then run vscode-refresh-env from
# the pane's directory so it refreshes the session env (fresh sockets for
# later panes) and repoints the session CWD here in one go.
bind r source-file ~/.tmux.conf \; \
	run-shell 'cd "#{pane_current_path}" && eval "$(vscode-refresh-env)"' \; \
	display "Reloaded config + env"
# send C-a
bind C-a send-prefix

# status bar
#
set -g monitor-activity on
set -g visual-activity on

# sessions
#
bind -r ( switch-client -p
bind -r ) switch-client -n

# windows
#
bind -r b select-window -t :-
bind -r n select-window -t :+

# ^A c -- open the new window at the current pane, never where the session
# was first created. Splits (^A | / ^A -) already do the same.
bind c new-window -c "#{pane_current_path}"

# panes
#
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# buffers
#
bind = paste-buffer
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection

# clear scroll
#
bind C-l send-keys -R \; clear-history

# http://stahlke.org/dan/tmux-nested/
set -g status-bg colour40

bind -n C-t new-window -a
bind -n S-left  prev
bind -n S-right next
bind -n S-C-left  swap-window -t -1
bind -n S-C-right swap-window -t +1

bind -n M-F11 set -qg status-bg colour25
bind -n M-F12 set -qg status-bg colour40
bind -n S-up \
	send-keys M-F12 \; \
	set -qg status-bg colour25 \; \
	unbind -n S-left \; \
	unbind -n S-right \; \
	unbind -n S-C-left \; \
	unbind -n S-C-right \; \
	unbind -n C-t \; \
	set -qg prefix C-b

bind -n S-down \
	send-keys M-F11 \; \
	set -qg status-bg colour40 \; \
	bind -n S-left  prev \; \
	bind -n S-right next \; \
	bind -n S-C-left swap-window -t -1 \; \
	bind -n S-C-right swap-window -t +1 \; \
	bind -n C-t new-window -a -c "#{pane_current_path}" \; \
	set -qg prefix C-a
